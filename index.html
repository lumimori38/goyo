<script>
{
const W=180,H=320,TAU=Math.PI*2;
const $=s=>document.querySelector(s);
const stage=$('#stage'),cv=$('#cv'),cx=cv.getContext('2d');cv.width=W;cv.height=H;
const mkC=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const buf=mkC(W,H);let g=buf.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,now=()=>performance.now()/1000,ease=p=>.5-.5*Math.cos(Math.PI*clamp(p,0,1));
const srand=s=>{const x=Math.sin(s*12.9898+78.233)*43758.5453;return x-Math.floor(x)};
function on(ctx,fn){const o=g;g=ctx;fn();g=o}
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)))}
function hx(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}
function vg(y0,y1,st,x0=0,w=W){const S=st.map(([p,c])=>[p,hx(c)]);for(let y=y0;y<y1;y++){const t=(y-y0)/Math.max(1,y1-y0-1);let i=0;while(i<S.length-2&&t>S[i+1][0])i++;const a=S[i],b=S[i+1],k=clamp((t-a[0])/(b[0]-a[0]),0,1);g.fillStyle='rgb('+a[1].map((v,j)=>Math.round(v+(b[1][j]-v)*k))+')';g.fillRect(x0,y,w,1)}}
function glow(x,y,r,c,a){if(!(a>.003))return;g.save();g.globalCompositeOperation='lighter';const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,'rgba('+c+','+a+')');q.addColorStop(1,'rgba('+c+',0)');g.fillStyle=q;g.fillRect(x-r,y-r,r*2,r*2);g.restore()}
function poly(p,c){g.fillStyle=c;g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();g.fill()}
function spr(rows,pal,x,y,br=0,cut=5){x=Math.round(x);y=Math.round(y);for(let j=0;j<rows.length;j++){const r=rows[j],yy=y+j-(j<cut?br:0);for(let i=0;i<r.length;i++){const c=pal[r[i]];if(c){g.fillStyle=c;g.fillRect(x+i,yy,1,1);if(br&&j===cut-1)g.fillRect(x+i,yy+1,1,1)}}}}
function hole(c,inside){const x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height);for(let y=0;y<c.height;y++)for(let i=0;i<c.width;i++)if(inside(i,y))d.data[(y*c.width+i)*4+3]=0;x.putImageData(d,0,0)}
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const vig=mkC(W,H);on(vig.getContext('2d'),()=>{const q=g.createRadialGradient(W/2,H*.48,H*.22,W/2,H*.48,H*.74);q.addColorStop(0,'rgba(0,0,0,0)');q.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=q;g.fillRect(0,0,W,H)});

let ac=null,master,bgmBus,bgmIn,ambBus,sfxBus,revIn,wob;const NB={};
const G=(v=1)=>{const n=ac.createGain();n.gain.value=v;return n};
const F=(t,f,q=.7)=>{const n=ac.createBiquadFilter();n.type=t;n.frequency.value=f;n.Q.value=q;return n};
const O=(t,f)=>{const o=ac.createOscillator();o.type=t;o.frequency.value=f;return o};
function via(dest,...ns){let n=dest;for(let i=ns.length-1;i>=0;i--){ns[i].connect(n);n=ns[i]}return n}
function loopSrc(b,out,rate=1){const s=ac.createBufferSource();s.buffer=b;s.loop=true;s.playbackRate.value=rate;s.connect(out);s.start(0,Math.random()*b.duration);return s}
function nz(out,t,d,b=NB.white){const s=ac.createBufferSource();s.buffer=b;s.loop=true;s.connect(out);s.start(t,Math.random()*b.duration);s.stop(t+d+.02);return s}
function env(gn,t,a,p,d){gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(p,t+a);gn.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function tone(out,t,ty,f,a,p,d,f2){const o=O(ty,f),e=G(0);o.connect(e);e.connect(out);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+a+d*.5);env(e,t,a,p,d);o.start(t);o.stop(t+a+d+.05)}
function hit(out,t,f,q,d,p,ty='bandpass'){const e=G(0),fl=F(ty,f,q);fl.connect(e);e.connect(out);nz(fl,t,d+.01);env(e,t,.002,p,d)}
function swell(out,t,d,src,fl,pts){const e=G(0);fl.connect(e);e.connect(out);nz(fl,t,d,src);e.gain.setValueAtTime(.0001,t);for(const[x,v]of pts)e.gain.linearRampToValueAtTime(v,t+x);return fl}
function mkBuf(sec,fn){const sr=ac.sampleRate,n=sr*sec|0,b=ac.createBuffer(1,n,sr);fn(b.getChannelData(0),sr,n);return b}
function burst(d,at,len,amp,dec){const n=d.length;for(let i=0;i<len;i++)d[(at+i)%n]+=(Math.random()*2-1)*amp*Math.exp(-i/(len*dec))}
function mkIR(sec){const sr=ac.sampleRate,n=sr*sec|0,b=ac.createBuffer(2,n,sr);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}return b}
function bufs(){
  const w=()=>Math.random()*2-1;
  NB.white=mkBuf(3,d=>{for(let i=0;i<d.length;i++)d[i]=w()});
  NB.brown=mkBuf(8,d=>{let l=0;for(let i=0;i<d.length;i++){l=(l+.02*w())/1.02;d[i]=l*3.5}});
  NB.rain=mkBuf(6,(d,sr,n)=>{let l=0;for(let i=0;i<n;i++){l=(l+.02*w())/1.02;d[i]=l*1.6+w()*.035}for(let k=0;k<4200;k++)burst(d,Math.random()*n|0,sr*rnd(.001,.005)|0,rnd(.02,.11),.3)});
  NB.glass=mkBuf(7,(d,sr,n)=>{for(let k=0;k<50;k++){const at=Math.random()*n|0,f=rnd(1600,3800),a=rnd(.12,.45),L=sr*.035|0;for(let i=0;i<L;i++)d[(at+i)%n]+=Math.sin(TAU*f*i/sr)*a*Math.exp(-i/(L*.15))+w()*a*.5*Math.exp(-i/(L*.04))}});
  NB.crack=mkBuf(8,(d,sr,n)=>{for(let k=0;k<180;k++){let at=Math.random()*n|0;const c=Math.random()<.35?2+(Math.random()*4|0):1;for(let j=0;j<c;j++){burst(d,at,sr*rnd(.0006,.008)|0,rnd(.08,1)**2,.25);at+=sr*rnd(.005,.04)|0}}});
  NB.bugs=mkBuf(6,(d,sr,n)=>{for(const[f,per,a]of[[4300,.62,.09],[4750,.85,.06],[3900,1.15,.05]]){let t=Math.random()*per;while(t<6){for(let p=0;p<3;p++){const st=(t+p*.026)*sr|0,L=sr*.015|0;for(let i=0;i<L;i++)d[(st+i)%n]+=Math.sin(TAU*f*i/sr)*Math.sin(Math.PI*i/L)*a}t+=per*rnd(.9,1.1)}}});
  NB.water=mkBuf(6,(d,sr,n)=>{let l=0;for(let i=0;i<n;i++){l=(l+.06*w())/1.06;d[i]=l*.8+w()*.03}for(let k=0;k<300;k++){const at=Math.random()*n|0,f0=rnd(350,1000),L=sr*rnd(.012,.04)|0,a=rnd(.04,.14);let ph=0;for(let i=0;i<L;i++){ph+=TAU*f0*(1+i/L*1.4)/sr;d[(at+i)%n]+=Math.sin(ph)*a*Math.sin(Math.PI*i/L)}}});

}
function aInit(){
  if(ac){if(ac.state!=='running')ac.resume().catch(()=>{});return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{ac=new C()}catch(e){return}
  master=G(1);const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;master.connect(comp);comp.connect(ac.destination);
  const rv=ac.createConvolver();rv.buffer=mkIR(3.6);revIn=G(.55);revIn.connect(rv);rv.connect(master);

  ambBus=G(1);ambBus.connect(master);sfxBus=G(.9);sfxBus.connect(master);const sr=G(.35);sfxBus.connect(sr);sr.connect(revIn);
  wob=G(7);const l=O('sine',.55);l.connect(wob);l.start();

  const s=ac.createBufferSource();s.buffer=ac.createBuffer(1,1,22050);s.connect(ac.destination);s.start(0);

function click(out,t,f){hit(out,t,f,4,.025,.6);tone(out,t,'sine',f*.4,.001,.15,.02)}
function tickClock(out,t,alt){hit(out,t,alt?2500:3200,5,.03,.7);tone(out,t,'sine',alt?850:1000,.001,.12,.035)}

    this.pass=this.pass.filter(p=>T-p.t0<p.d);if(T>this.flT){this.fl=1}
  },
  draw(T){const c=this.cat;
    g.drawImage(this.bg,0,0);glow(36,50,16,'240,230,200',.25);g.fillStyle='#efe6c8';g.beginPath();g.arc(36,50,5,0,TAU);g.fill();
    glow(103,66,14,'255,210,150',.5);glow(103,152,32,'255,200,140',.16);glow(133,132,22,'190,225,255',.28);
    const tl=T%22,lc=tl<10?['80,255,160','#5dffa0']:tl<12?['255,210,80','#ffd250']:['255,80,80','#ff5050'];R(160,lc[1]==='#5dffa0'?101:lc[1]==='#ffd250'?97:93,2,2,lc[1]);glow(161,98,8,lc[0],.5);for(let y=162;y<WY1;y++)if(Math.sin(y*.8-T*3)>-.3)R(160+Math.sin(y*.5+T)*.6,y,2,1,'rgba('+lc[0]+','+(.18*(1-(y-162)/32)).toFixed(3)+')');
    for(const p of this.pass){const k=(T-p.t0)/p.d;if(k<0)continue;const x=p.dir>0?-50+280*k:230-280*k;R(x-20,172,40,9,'#06080f');R(x-13,166,24,7,'#06080f');glow(x+20*p.dir,177,14,'255,240,200',.55);glow(x-20*p.dir,176,6,'255,50,50',.45)}
    if(c.s!=='none'){const cx0=c.x;if(c.s==='sit'){const blink=(T-c.bl<.9)||((T%5)<.15);const rows=blink?SCAT.map(r=>r.replace(/e/g,'k')):SCAT;spr(rows,{k:'#26242e',e:'#d8e86a',n:'#e89aa0'},cx0,141);const tw=Math.sin(T*2)*2;R(cx0+9,148,2,1,'#26242e');R(cx0+11,147+tw*.3,1,2,'#26242e');R(cx0+12,145+tw*.5,1,2,'#26242e')}else{const fr=(T*5|0)%2;g.save();if(c.s==='leave'){}spr(fr?WCAT:WCAT2,{k:'#26242e',e:'#d8e86a'},cx0,146);g.restore()}}
    for(const h of c.hearts)if(h.l>0)spr(HEART,{p:'rgba(255,143,177,'+(1-h.l/1.5).toFixed(2)+')'},h.x,h.y);
    R(WX0,34,WX1-WX0,1,'rgba(255,255,255,.07)');R(WX0,36,WX1-WX0,2,'rgba(255,255,255,.04)');R(20,WY1-10,40,1,'rgba(255,255,255,.04)');
    g.drawImage(this.frame,0,0);
    if(this.fl)glow(90,14,100,'230,245,255',.14);else R(22,13,136,2,'#cfd3c8');
    const r=this.rm,cx1=64,cy=178;
    for(let j=0;j<16;j++){const w=14-j*.15;R(cx1+7-w/2,cy+j,w,1,j>=4&&j<8?'#d9473a':'#f4f1ea')}R(cx1+6,cy+5,3,2,'#ffffff');
    if(r.s==='idle'){R(cx1-1,cy-1,16,2,'#e6dcc0');R(cx1+13,cy-2,3,2,'#e6dcc0')}
    else if(r.s==='cook'){R(cx1-1,cy-1,16,2,'#e6dcc0');R(cx1-3,cy-3,20,1,'#c8a070');R(cx1-3,cy-5,20,1,'#c8a070');const p=clamp((T-r.t0)/180,0,1);for(let k=0;k<24;k++){if(k/24>p)break;const a=-Math.PI/2+k/24*TAU;R(cx1+7+Math.cos(a)*13,cy+7+Math.sin(a)*11,1,1,'rgba(255,207,122,.85)')}}
    else{R(cx1,cy,14,2,'#f0d08a');if(r.s==='done'){R(cx1+2,cy-8,12,2,'#e6dcc0');R(cx1+3,cy-6,10,1,'#d4c8a8')}}
    for(const s of this.steam)R(s.x,s.y,1,1,'rgba(255,255,255,'+(.35*(1-s.l/2.2)).toFixed(3)+')');
    g.drawImage(vig,0,0);
  },
  audio(A){const o=A.outs;
    const fg=G(1);fg.connect(o.fridge);[[58,.1],[116,.04],[174,.015]].forEach(([f,v])=>{const x=O('sine',f),gg=G(v);x.connect(gg);gg.connect(fg);x.start();A.keep(x)});A.keep(loopSrc(NB.brown,via(fg,F('lowpass',140),G(.4))));
    const lfo=O('sine',.05),lg=G(.25);lfo.connect(lg);lg.connect(fg.gain);lfo.start();A.keep(lfo);
    [[120,.02],[240,.012]].forEach(([f,v])=>{const x=O('sine',f),gg=G(v);x.connect(gg);gg.connect(o.light);x.start();A.keep(x)});A.keep(loopSrc(NB.white,via(o.light,F('highpass',6000),G(.015))));
    A.every(8,22,t=>{if(!A.on('light'))return;this.fl=0;this.flT=now()+rnd(.08,.25);hit(o.light,t,4000,2,.03,.2)});
    A.every(26,60,t=>{if(!A.on('door'))return;swell(o.door,t,1,NB.white,F('bandpass',900,.8),[[.4,.08],[1,.0001]]);tiring(o.door,t+.45)});
    A.every(15,40,t=>{if(!A.on('cars'))return;const r=carPass(o.cars,t);this.pass.push({t0:now()+.05,d:r.d,dir:r.dir})});
  }
};

const SC={car:CAR,room:ROOM,temple:TEMPLE,beach:BEACH,train:TRAIN,store:STORE},ORDER=['car','room','temple','beach','train','store'];
const KEY='lumi-goyo-v1';let ST={};try{ST=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}};
function cfg(id){const s=SC[id];if(!ST[id])ST[id]={bgm:s.bgm,bgmVol:.5,vols:{}};if(ST[id].bgm>=TR.length)ST[id].bgm=s.bgm;for(const l of s.layers)if(ST[id].vols[l.id]==null)ST[id].vols[l.id]=l.v;return ST[id]}
ORDER.forEach(id=>{const s=SC[id];s.init();const b=document.createElement('button');b.className='card';b.innerHTML='<canvas width="'+W+'" height="150"></canvas><span class="cap"><b>'+s.name+'</b><small>'+s.sub+'</small></span>';b.onclick=()=>enter(id);$('#list').appendChild(b);s.card=b.querySelector('canvas').getContext('2d')});

let cur=null,idleT=0,sheetOpen=false,openedAt=0,gated=false;
const hintEl=$('#hint');
function setHint(t,big){hintEl.textContent=t;hintEl.hidden=false;hintEl.classList.toggle('big',!!big)}
function poke(){$('#view').classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>{if(!sheetOpen&&$('#share').hidden&&!gated)$('#view').classList.add('idle')},6000)}
function startAudio(id){if(!ac)return;startSA(SC[id]);const C=cfg(id);bgmBus.gain.setValueAtTime(vc(C.bgmVol)*.9,ac.currentTime);bgmPlay(C.bgm)}
function enter(id,noAudio){if(!noAudio)aInit();cur=id;const s=SC[id];$('#home').hidden=true;$('#view').hidden=false;$('#sname').textContent=s.name;
  const acts=$('#acts');acts.innerHTML='';s.actions.forEach(a=>{const b=document.createElement('button');b.className='act';b.textContent=a.label?a.label.call(s):a.n;b.onclick=e=>{e.stopPropagation();aInit();if(a.off&&a.off.call(s))return;a.f.call(s);refresh();poke()};a.el=b;acts.appendChild(b)});
  setHint(s.hint);if(id==='car'){CAR.fog.fill(1);CAR.last.fill(-99)}
  try{history.replaceState(null,'','#'+id)}catch(e){}
  if(!noAudio)startAudio(id);poke()}
function leave(){stopSA();bgmStop();closeSheet();$('#share').hidden=true;$('#gate').hidden=true;gated=false;cur=null;$('#view').hidden=true;$('#home').hidden=false;try{history.replaceState(null,'',location.pathname+location.search.replace(/[?&]r=[^]*$/,''))}catch(e){}}
function refresh(){if(!cur)return;const s=SC[cur];for(const a of s.actions){if(!a.el)continue;if(a.label){const t=a.label.call(s);if(a.el.textContent!==t)a.el.textContent=t}a.el.classList.toggle('off',!!(a.off&&a.off.call(s)))}}
setInterval(refresh,300);
$('#back').onclick=leave;
function paint(i){i.style.setProperty('--v',i.value+'%')}
function openSheet(){const s=SC[cur],C=cfg(cur);
  $('#chips').innerHTML=[{i:-1,n:'끄기'}].concat(TR.map((t,i)=>({i,n:t.n}))).map(c=>'<button class="chip'+(c.i===C.bgm?' on':'')+'" data-i="'+c.i+'">'+c.n+'</button>').join('');
  $('#bgmv').value=Math.round(C.bgmVol*100);paint($('#bgmv'));
  $('#rows').innerHTML=s.layers.map(l=>'<label class="row"><span>'+l.n+(l.rare?'<i>가끔</i>':'')+'</span><input type="range" min="0" max="100" data-id="'+l.id+'" value="'+Math.round(C.vols[l.id]*100)+'"></label>').join('');
  $('#rows').querySelectorAll('input').forEach(paint);
  $('#sheet').classList.add('open');$('#scrim').hidden=false;sheetOpen=true;openedAt=performance.now();$('#view').classList.remove('idle')}
function closeSheet(){$('#sheet').classList.remove('open');$('#scrim').hidden=true;sheetOpen=false;poke()}
$('#mix').onclick=e=>{e.stopPropagation();aInit();openSheet()};
$('#shx').onclick=closeSheet;$('#scrim').onclick=()=>{if(performance.now()-openedAt>400)closeSheet()};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const i=+b.dataset.i,C=cfg(cur);C.bgm=i;save();aInit();if(ac){bgmBus.gain.setTargetAtTime(vc(C.bgmVol)*.9,ac.currentTime,.05);bgmPlay(i)}$('#chips').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b))};
$('#bgmv').oninput=e=>{paint(e.target);const v=e.target.value/100;cfg(cur).bgmVol=v;save();if(ac)bgmBus.gain.setTargetAtTime(vc(v)*.9,ac.currentTime,.08)};
$('#rows').oninput=e=>{const t=e.target;if(!t.dataset.id)return;paint(t);const v=t.value/100;cfg(cur).vols[t.dataset.id]=v;save();if(SA&&SA.outs[t.dataset.id])SA.outs[t.dataset.id].gain.setTargetAtTime(vc(v),ac.currentTime,.08)};
$('#view').addEventListener('pointerdown',poke,true);
$('#gate').onclick=()=>{aInit();gated=false;$('#gate').hidden=true;startAudio(cur);poke()};

const BASE=(/github\.io$/.test(location.hostname)?location.origin+location.pathname:'https://lumimori38.github.io/goyo/');
function shareLink(){const s=SC[cur],C=cfg(cur);return BASE+'?r='+cur+'&m='+C.bgm+'&mv='+Math.round(C.bgmVol*100)+'&v='+s.layers.map(l=>Math.round(C.vols[l.id]*100)).join('.')}
function shareText(){const s=SC[cur],C=cfg(cur),ls=s.layers.filter(l=>C.vols[l.id]>.01).map(l=>l.n);let line=ls.join(' · ');if(C.bgm>=0)line+=(line?' + ':'')+'음악 「'+TR[C.bgm].n+'」';return'[고요, 나의 작은 세계] '+s.name+'\n'+line+'\n\n'+shareLink()+'\n\n#루미오락실 #고요나의작은세계 #힐링'}
let shURL=null,shBlob=null;
async function makeCard(){const c=mkC(1080,1920),x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(buf,0,0,1080,1920);
  const q=x.createLinearGradient(0,1380,0,1920);q.addColorStop(0,'rgba(6,6,12,0)');q.addColorStop(1,'rgba(6,6,12,.82)');x.fillStyle=q;x.fillRect(0,1380,1080,540);
  try{await document.fonts.load('64px "Gowun Dodum"')}catch(e){}
  const s=SC[cur],C=cfg(cur);x.textAlign='center';x.fillStyle='#f4ecdc';x.font='68px "Gowun Dodum",sans-serif';x.fillText(s.name,540,1650);
  x.font='34px "Gowun Dodum",sans-serif';x.fillStyle='rgba(240,232,214,.82)';const ls=s.layers.filter(l=>C.vols[l.id]>.01).map(l=>l.n).slice(0,3).join(' · ');x.fillText(ls,540,1720);if(C.bgm>=0){x.fillStyle='rgba(255,207,122,.9)';x.fillText('♪ '+TR[C.bgm].n,540,1772)}
  x.font='26px "Gowun Dodum",sans-serif';x.fillStyle='rgba(200,194,216,.65)';x.fillText('고요, 나의 작은 세계 × 루미 오락실 · @lumimori38',540,1868);
  return new Promise(r=>c.toBlob(b=>r(b),'image/png'))}
$('#shr').onclick=async e=>{e.stopPropagation();const s=SC[cur];s.draw(now(),false);const b=await makeCard();if(shURL)URL.revokeObjectURL(shURL);shURL=URL.createObjectURL(b);$('#shImg').src=shURL;$('#tip').textContent='이미지를 꾹 눌러도 저장할 수 있어요';$('#tip').classList.remove('on');$('#share').hidden=false;$('#sSave').textContent='이미지 저장하기';$('#sCopy').textContent='링크 복사하기';$('#sTw').textContent='트위터 공유하기';shBlob=b};
$('#sX').onclick=()=>{$('#share').hidden=true;poke()};
$('#sSave').onclick=()=>{const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),inapp=/KAKAOTALK|Instagram|FBAN|FBAV|Line\/|Twitter/i.test(ua),b=$('#sSave');
  if(ios||inapp){$('#tip').textContent='이미지를 꾹 눌러 저장하세요';$('#tip').classList.add('on');b.textContent='꾹 눌러 저장해요'}else{try{const a=document.createElement('a');a.href=shURL;a.download='goyo-'+cur+'.png';document.body.appendChild(a);a.click();a.remove()}catch(x){}b.textContent='저장했어요!'}
  setTimeout(()=>b.textContent='이미지 저장하기',1500)};
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}ta.remove();return ok}}
function toast(b,msg,label,ms=1800){b.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('span');t.className='toast';t.textContent=msg;b.appendChild(t);setTimeout(()=>{t.remove();b.textContent=label},ms)}
$('#sCopy').onclick=async()=>{const b=$('#sCopy');await copyText(shareText());b.textContent='복사 완료!';toast(b,'링크가 복사됐어요!','링크 복사하기')};
$('#sTw').onclick=async()=>{const b=$('#sTw'),txt=shareText();await copyText(txt);
  try{const f=new File([shBlob],'goyo-'+cur+'.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f],text:txt})){await navigator.share({files:[f],text:txt});b.textContent='트위터 공유하기';toast(b,'문구가 안 들어갔다면 붙여 넣어 주세요','트위터 공유하기',2600);return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href='https://twitter.com/intent/tweet?text='+encodeURIComponent(txt);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();toast(b,'이미지는 저장해서 첨부해 주세요','트위터 공유하기',2600)};

const lp=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]};
let down=false;
cv.addEventListener('pointerdown',e=>{if(!cur||gated)return;aInit();down=true;try{cv.setPointerCapture(e.pointerId)}catch(x){}const[x,y]=lp(e);const s=SC[cur];s.down&&s.down(x,y,now());if(!(cur==='beach'&&BEACH.br)&&!hintEl.classList.contains('big'))hintEl.hidden=true;e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(!cur||!down)return;const[x,y]=lp(e),s=SC[cur];s.move&&s.move(x,y,now())});
const up=()=>{if(!down)return;down=false;const s=cur&&SC[cur];s&&s.up&&s.up()};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
document.addEventListener('contextmenu',e=>{if(e.target.id!=='shImg')e.preventDefault()});
document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else if(cur)ac.resume()});

function fit(){const r=stage.getBoundingClientRect(),s=r.width/W,h=H*s;cv.style.width=r.width+'px';cv.style.height=h+'px';cv.style.left='0px';cv.style.top=((r.height-h)/2)+'px'}
addEventListener('resize',fit);fit();

(function boot(){const q=new URLSearchParams(location.search);let id=q.get('r');const hsh=location.hash.slice(1);if(!SC[id]&&SC[hsh])id=hsh;if(!SC[id])return;
  const C=cfg(id);if(q.get('r')){const m=+q.get('m');if(m>=-1&&m<TR.length)C.bgm=m;const mv=+q.get('mv');if(mv>=0&&mv<=100)C.bgmVol=mv/100;const v=(q.get('v')||'').split('.');SC[id].layers.forEach((l,i)=>{const n=+v[i];if(v[i]!==undefined&&v[i]!==''&&n>=0&&n<=100)C.vols[l.id]=n/100});save()}
  enter(id,true);gated=true;$('#gate').hidden=false})();

let last=performance.now(),fr=0;
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;const T=t/1000;fr++;
  if(cur){const s=SC[cur];s.update(dt,T);s.draw(T);cx.drawImage(buf,0,0)}
  else{for(const id of ORDER)SC[id].update(dt,T);const s=SC[ORDER[fr%ORDER.length]];s.draw(T,true);s.card.drawImage(buf,0,s.crop,W,150,0,0,W,150)}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
}
